# Discovery v1 — frozen product config.
# Learning systems must not write this file.

universe:
  primary_tiers: [sme, microcap]
  include_smallcap: false          # Tier C is optional and never mixed into primary scores
  mcap_min_cr: 50
  microcap_max_cr: 1000
  smallcap_max_cr: 5000
  min_adv_inr: 5000000             # ₹50 lakh — hard gate before any LLM call
  indices:
    - NIFTY MICROCAP 250
  smallcap_index: NIFTY SMALLCAP 250
  include_nse_sme: true
  include_bse_sme: true
  exclude_tickers: []

radar:
  announcement_lookback_days: 3
  max_raw_announcements: 500
  max_events_to_llm: 40
  news_as_secondary: true
  cache_ttl_minutes: 180

liquidity:
  hard_gate: true
  unknown_is_exclude: true

scarcity:
  analyst_weight: 0.5
  muted_reaction_weight: 0.5
  muted_abs_return_pct: 5.0
  min_volume_participation: 0.5    # below this is thin tape, not "market ignored it"

opportunity_score:
  frozen: true
  weights:
    catalyst: 0.25
    scarcity: 0.20
    quality: 0.20
    inflection: 0.25
    mispricing: 0.10

catalyst_cards:
  top_n: 15
  horizon_days: 30
  max_cards_per_ticker: 1

materiality:
  investigate_min: 2
  candidate_min: 3
  revenue_weak: 0.05
  revenue_moderate: 0.20
  revenue_major: 0.50

